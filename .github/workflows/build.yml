name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: github-ubuntu-latest-s
    name: Build
    permissions:
      id-token: write
      contents: write
    outputs:
      BUILD_NUMBER: ${{ steps.build.outputs.BUILD_NUMBER }}
      project-version: ${{ steps.build.outputs.project-version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.5.12
          tool_versions: |
            java temurin-21
            node 18.17.0
      - uses: SonarSource/ci-github-actions/build-gradle@v2
        id: build
        env:
          BUILD_NAME: ${{ github.event.repository.name }}
        with:
          deploy-pull-request: true
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer


  linux-qa:
    needs: build
    runs-on: github-ubuntu-latest-s
    name: Linux QA - SQ ${{ matrix.sq_version }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - sq_version: LATEST_RELEASE[2025.1]
            java_version: "17"
          - sq_version: LATEST_RELEASE[2026.1]
            java_version: "21"
          - sq_version: LATEST_RELEASE
            java_version: "21"
          - sq_version: DEV
            java_version: "21"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.5.12
          tool_versions: |
            java temurin-${{ matrix.java_version }}

      - name: Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/github/token/licenses-ro token | GITHUB_TOKEN;

      - name: Set project version of the build job
        shell: bash
        env:
          PROJECT_VERSION: ${{ needs.build.outputs.project-version }}
        run: |
          # The integration tests run against the distributions deployed by the build job. Setting the version also
          # skips config-gradle's replacement of the version in gradle.properties.
          echo "CURRENT_VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

      - uses: SonarSource/ci-github-actions/config-gradle@v2
        with:
          artifactory-reader-role: private-reader

      - name: Run Integration Tests
        env:
          SQ_VERSION: ${{ matrix.sq_version }}
          GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
        run: ./gradlew integrationTest -Dsonar.runtimeVersion="${SQ_VERSION}"

  windows-qa:
    needs: build
    runs-on: github-windows-latest-s
    name: Windows QA - SQ ${{ matrix.sq_version }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - sq_version: LATEST_RELEASE[2025.1]
            java_version: "17"
          - sq_version: LATEST_RELEASE[2026.1]
            java_version: "21"
          - sq_version: LATEST_RELEASE
            java_version: "21"
          - sq_version: DEV
            java_version: "21"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.5.12
          tool_versions: |
            java ${{ matrix.java_version }}

      - name: Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/github/token/licenses-ro token | GITHUB_TOKEN;

      - name: Set project version of the build job
        shell: bash
        env:
          PROJECT_VERSION: ${{ needs.build.outputs.project-version }}
        run: |
          # The integration tests run against the distributions deployed by the build job. Setting the version also
          # skips config-gradle's replacement of the version in gradle.properties.
          echo "CURRENT_VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

      - uses: SonarSource/ci-github-actions/config-gradle@v2
        with:
          artifactory-reader-role: private-reader

      - name: Run Integration Tests
        shell: bash
        env:
          SQ_VERSION: ${{ matrix.sq_version }}
          GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
        run: ./gradlew integrationTest -Dsonar.runtimeVersion="${SQ_VERSION}"

      - name: Stop Gradle daemon
        if: always()
        shell: bash
        # The post-job step saves the Gradle cache with tar, which fails on the lock files held by the daemon
        run: ./gradlew --stop

  promote:
    needs:
      - build
      - linux-qa
      - windows-qa
    runs-on: github-ubuntu-latest-s
    name: Promote
    permissions:
      id-token: write
      contents: write
    env:
      BUILD_NUMBER: ${{ needs.build.outputs.BUILD_NUMBER }}
    steps:
      - uses: SonarSource/ci-github-actions/promote@v2
        with:
          promote-pull-request: true
