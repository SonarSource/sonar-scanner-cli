name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: github-ubuntu-latest-s
    name: Build
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.17
          tool_versions: |
            java temurin-21
            maven 3.9
            node 18.17.0
      - uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          deploy-pull-request: true
          maven-args: -Pdist-linux-x64,dist-linux-aarch64,dist-windows-x64,dist-macosx-x64,dist-macosx-aarch64
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer


  linux-qa:
    needs: build
    runs-on: github-ubuntu-latest-s
    name: Linux QA - SQ ${{ matrix.sq_version }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - sq_version: LATEST_RELEASE[2025.1]
            java_version: "17"
            # Keep the Java 17 compatibility leg on a Java 17-compatible WS client.
            maven_args: -Dsonar.buildVersion=25.12.0.117093 -Dmaven.compiler.release=17
          - sq_version: LATEST_RELEASE[2026.1]
            java_version: "21"
          - sq_version: LATEST_RELEASE
            java_version: "21"
          - sq_version: DEV
            java_version: "21"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.17
          tool_versions: |
            java temurin-${{ matrix.java_version }}
            maven 3.9

      - name: Install Java 11 for CLI compatibility test
        if: matrix.sq_version == 'LATEST_RELEASE'
        run: |
          mise install java@temurin-11
          echo "CLI_JAVA_11_HOME=$(mise where java@temurin-11)" >> "$GITHUB_ENV"

      - name: Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/github/token/licenses-ro token | GITHUB_TOKEN;

      - uses: SonarSource/ci-github-actions/config-maven@v2
        with:
          artifactory-reader-role: private-reader
          cache-paths: |
            ~/.m2/repository

      - name: Run Integration Tests
        env:
          MAVEN_ARGS: ${{ matrix.maven_args }}
          SQ_VERSION: ${{ matrix.sq_version }}
          GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
        run: |
          cd it
          mvn -B -e -Dsonar.runtimeVersion="${SQ_VERSION}" -Dmaven.test.redirectTestOutputToFile=false verify

  windows-qa:
    needs: build
    runs-on: github-windows-latest-s
    name: Windows QA - SQ ${{ matrix.sq_version }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - sq_version: LATEST_RELEASE[2025.1]
            java_version: "17"
            # Keep the Java 17 compatibility leg on a Java 17-compatible WS client.
            maven_args: -Dsonar.buildVersion=25.12.0.117093 -Dmaven.compiler.release=17
          - sq_version: LATEST_RELEASE[2026.1]
            java_version: "21"
          - sq_version: LATEST_RELEASE
            java_version: "21"
          - sq_version: DEV
            java_version: "21"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.17
          tool_versions: |
            java ${{ matrix.java_version }}
            maven 3.9

      - name: Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/github/token/licenses-ro token | GITHUB_TOKEN;

      - uses: SonarSource/ci-github-actions/config-maven@v2
        with:
          artifactory-reader-role: private-reader
          cache-paths: |
            ~/.m2/repository

      - name: Run Integration Tests
        shell: bash
        env:
          MAVEN_ARGS: ${{ matrix.maven_args }}
          SQ_VERSION: ${{ matrix.sq_version }}
          GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
        run: |
          cd it
          mvn -B -e -Dsonar.runtimeVersion="${SQ_VERSION}" -Dmaven.test.redirectTestOutputToFile=false verify

  promote:
    needs:
      - linux-qa
      - windows-qa
    runs-on: github-ubuntu-latest-s
    name: Promote
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: SonarSource/ci-github-actions/promote@v2
        with:
          promote-pull-request: true
